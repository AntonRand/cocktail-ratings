<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarazza Cocktail Ratings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-shapes" aria-hidden="true">
    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>
  </div>

  <div class="page">
    <header class="header">
      <p class="eyebrow">Tarazza Rooftop Bar</p>
      <h1>Cocktail Scoreboard</h1>
      <p class="subtitle">Anton & Verity rate every drink out of 10. Scores save automatically.</p>
    </header>

    <div class="legend">
      <div class="legend-item">
        <span class="legend-badge anton">A</span>
        <span>Anton</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge verity">V</span>
        <span>Verity</span>
      </div>
    </div>

    <main id="cocktail-list" class="cocktail-list" aria-live="polite">
      <p class="loading">Shaking up the menu…</p>
    </main>

    <footer class="footer">
      <p id="status" class="status" aria-live="polite"></p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
