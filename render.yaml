databases:
  - name: cocktail-ratings-db
    plan: free
    databaseName: cocktail_ratings

services:
  - type: web
    name: cocktail-ratings
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ratings
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cocktail-ratings-db
          property: connectionString
